# Starts fork-release.yml when GitHub has turned it off (pnupu/t3code#34): a turned-off
# workflow creates no run for a push, so merges to main published nothing. Fork-only file.
name: Fork release watch

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: fork-release-watch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watch:
    name: Start a missing release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow=$(gh api "repos/$GH_REPO/actions/workflows/fork-release.yml" \
            --jq '"\(.state) \(.updated_at)"')
          read -r state updated_at <<< "$workflow"
          if [[ "$state" != active ]]; then
            echo "::warning::fork-release.yml was $state (updated_at $updated_at); turning it on."
            gh workflow enable fork-release.yml
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "fork-release.yml is on, so this push starts it."
            exit 0
          fi
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          # A failed run counts, since a failed release opens a fork-sync issue; a cancelled one does not.
          runs=$(gh run list --workflow fork-release.yml --commit "$head" --limit 20 --json conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")] | length')
          if [[ "$runs" != 0 ]]; then
            echo "fork-release.yml already ran on $head."
            exit 0
          fi
          # fork-release.yml runs one at a time, so a duplicate's preflight sees the new tag and skips.
          gh workflow run fork-release.yml --ref main
          echo "Started fork-release.yml on $head."
